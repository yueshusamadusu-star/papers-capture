name: 测试
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p "test_*.py" -v
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[mcp]"
      - run: python tests/smoke_mcp.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tests/test_extension.cjs
      - run: node tests/test_inspect.cjs
      - run: node tests/test_chrome_ieee.cjs
